name: Build Obscura image

# Rebuilds ghcr.io/georgemadas/obscura when something that is baked into the image changes.
# App code (app.py, static/, workflows/ ...) is pulled at boot, so pushing it does NOT trigger a build.
on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/requirements.txt
      - deploy/install_comfyui.sh
      - .github/workflows/docker-image.yml
  workflow_dispatch: # "Run workflow" button in the Actions tab

concurrency:
  group: docker-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/georgemadas/obscura

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # The CUDA base image plus two torch venvs is ~30 GB; the stock runner has ~14 GB free
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/local/.ghcup /usr/share/swift /opt/microsoft /opt/google /usr/lib/jvm
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      # Layer cache lives in the registry, so a rebuild only redoes the layers whose inputs changed
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

[program:obscura-dashboard]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/obscura-dashboard.sh
autostart=true
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_events_enabled=true
stdout_logfile_maxbytes=0
stdout_logfile_backups=0

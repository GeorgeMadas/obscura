<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0d0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Obscura terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<!--#include vendor/xterm.css-->
<style>
:root {
  /* Same darkroom palette as the setup dashboard (deploy/dashboard/index.html) */
  --black: #0d0b0a;
  --tray: #16120f;
  --tray-2: #1d1814;
  --line: #2a231d;
  --line-2: #3a3029;
  --paper: #efe9e3;
  --paper-2: #c4bab1;
  --muted: #8f857b;
  --faint: #5e554d;
  --safelight: #ff6a3d;
  --safelight-dim: rgba(255, 106, 61, .14);
  --fixer: #6fc7b4;
  --fail: #ff4d5e;
  --amber: #e8b04a;
  --sans: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --key-h: 44px;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: var(--black); }
body { color: var(--paper); font: 14px/1.4 var(--sans); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible {
  outline: 2px solid var(--safelight); outline-offset: 2px;
}

/* The app box tracks the visual viewport, so the bars sit right above the phone keyboard */
#app {
  position: fixed; left: 0; top: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column;
  padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
}

/* ---------- header */
.head {
  flex: none; display: flex; align-items: center; gap: 10px;
  padding: calc(6px + env(safe-area-inset-top, 0px)) 12px 6px;
  border-bottom: 1px solid var(--line); background: var(--black);
}
.conn {
  display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 10px; flex: none;
  border-radius: 16px; border: 1px solid var(--line-2); background: none; color: var(--paper-2);
  font-size: 13px; font-weight: 500; cursor: pointer;
}
.conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.conn.live { color: var(--fixer); border-color: rgba(111,199,180,.3); }
.conn.live i { background: var(--fixer); }
.conn.connecting { color: var(--safelight); border-color: rgba(255,106,61,.35); background: var(--safelight-dim); }
.conn.connecting i { background: var(--safelight); animation: pulse 1.6s ease-out infinite; }
.conn.offline { color: var(--amber); border-color: rgba(232,176,74,.35); }
.conn.offline i { background: var(--amber); }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255,106,61,.55); } 80%, 100% { box-shadow: 0 0 0 8px rgba(255,106,61,0); } }
.title { flex: 1; visibility: visible; min-width: 0; color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tools { flex: none; display: flex; gap: 6px; }
.tool {
  height: 32px; min-width: 38px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-2);
  background: var(--tray); color: var(--paper-2); font-size: 13px; font-weight: 500; cursor: pointer;
}
.tool:active { background: var(--tray-2); color: var(--paper); }
.tool.kbd { display: none; min-width: 44px; padding: 0 12px; }
.tool.kbd.on { border-color: rgba(255,106,61,.5); color: var(--safelight); background: var(--safelight-dim); }
@media (pointer: coarse) { .tool.desk { display: none; } .tool.kbd { display: inline-block; } }

/* ---------- terminal */
.term-wrap { position: relative; flex: 1; min-height: 0; background: var(--black); touch-action: none; }
#term { position: absolute; inset: 6px 4px 4px 8px; }
#term .xterm { height: 100%; }
/* Phones: a still layer over the terminal takes every touch. xterm redraws its rows while you drag, and a touch
   whose element is removed stops reporting moves, so scrolling on the rows themselves died after one step. */
.touch-layer {
  position: absolute; inset: 0; z-index: 2; display: none; touch-action: none; overflow: hidden;
  /* It also holds an invisible copy of the screen text, lined up with the terminal's cells, so press-and-hold
     selects real text and the phone's own Copy menu works */
  color: transparent; white-space: pre; user-select: text; -webkit-user-select: text; -webkit-touch-callout: default;
}
.touch-layer .mirror { position: absolute; left: 0; top: 0; }
.touch-layer .mirror div { overflow: hidden; }
.touch-layer ::selection { background: rgba(255,106,61,.42); color: transparent; }
@media (pointer: coarse) { .touch-layer { display: block; } }
#term .xterm-viewport { overscroll-behavior: none; background: var(--black) !important; }
.to-bottom {
  position: absolute; right: 12px; bottom: 12px; z-index: 5;
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px 0 12px; border-radius: 19px;
  border: 1px solid rgba(255,106,61,.45); background: #241712; color: var(--paper); font-size: 13.5px; font-weight: 500;
  box-shadow: 0 6px 20px rgba(0,0,0,.45); cursor: pointer;
}
.to-bottom svg { width: 14px; height: 14px; }
.notice {
  position: absolute; left: 50%; top: 14px; transform: translateX(-50%); z-index: 6; max-width: calc(100% - 32px);
  padding: 9px 14px; border-radius: 10px; background: var(--tray-2); border: 1px solid var(--line-2);
  color: var(--paper); font-size: 13.5px; box-shadow: 0 8px 28px rgba(0,0,0,.5);
  opacity: 0; transition: opacity .18s; pointer-events: none;
}
.notice.show { opacity: 1; }

/* ---------- bottom stack: quick commands, key pad */
.dock { flex: none; background: var(--tray); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
#app.kb .dock { padding-bottom: 0; }
.scroller {
  display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; scrollbar-width: none;
  -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain;
}
.scroller::-webkit-scrollbar { display: none; }
/* a fade on the right edge says "there is more, swipe sideways" */
.scroller.more { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 36px), transparent); }

.quick { padding: 8px 10px 2px; }
#app.kb .quick { display: none; }
.qbtn {
  flex: none; height: 34px; padding: 0 13px; border-radius: 17px; border: 1px solid var(--line-2);
  background: transparent; color: var(--paper-2); font-size: 13px; white-space: nowrap; cursor: pointer; touch-action: pan-x;
}
.qbtn.cmd { font-family: var(--mono); font-size: 12.5px; }
.qbtn:active { background: var(--tray-2); color: var(--paper); }
.qbtn.edit { color: var(--muted); border-style: dashed; }

/* Key pad: two rows that fit the screen, no sideways scrolling. Arrows sit like a keyboard's arrow block. */
.keys { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 8px 8px 8px; }
.key {
  height: var(--key-h); min-width: 0; padding: 0 2px; border-radius: 9px;
  border: 1px solid var(--line-2); border-bottom-width: 2px; background: var(--tray-2); color: var(--paper);
  font: 500 14px/1 var(--mono); white-space: nowrap; overflow: hidden; cursor: pointer;
  touch-action: manipulation; user-select: none; -webkit-user-select: none;
}
.key.arrow { font-size: 18px; }
.key.enter { background: #2a1d16; border-color: rgba(255,106,61,.4); color: var(--safelight); }
.key.pressed { background: var(--line-2); transform: translateY(1px); }
.key.mod.armed { border-color: var(--safelight); color: var(--safelight); background: var(--safelight-dim); }
.key.mod.locked { border-color: var(--safelight); background: var(--safelight); color: #1a0d07; }
.key.combo { color: var(--paper-2); }
#app.kb { --key-h: 38px; }
#app.kb .keys { padding-top: 6px; padding-bottom: 6px; gap: 5px; }

/* ---------- sheets (copy, quick-command editor) */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(5,4,3,.62); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  width: 100%; max-width: 680px; max-height: 86%; display: flex; flex-direction: column;
  background: var(--tray); border: 1px solid var(--line-2); border-bottom: 0; border-radius: 16px 16px 0 0;
  padding: 16px 16px calc(14px + env(safe-area-inset-bottom, 0px));
}
@media (min-width: 720px) { .scrim { align-items: center; } .sheet { border-radius: 16px; border-bottom: 1px solid var(--line-2); max-height: 80%; } }
.sheet h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.sheet .sub { margin: 3px 0 12px; color: var(--muted); font-size: 13px; }
.sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn {
  height: 40px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--tray-2);
  color: var(--paper); font-weight: 500; cursor: pointer;
}
.btn.primary { background: var(--safelight); border-color: var(--safelight); color: #1a0d07; font-weight: 600; }
.btn.danger { color: var(--fail); }
.btn.right { margin-left: auto; }
.screen-text {
  flex: 1; min-height: 120px; overflow: auto; margin: 0; padding: 12px; border-radius: 10px; background: var(--black);
  border: 1px solid var(--line); font: 12.5px/1.45 var(--mono); color: var(--paper-2); white-space: pre;
  user-select: text; -webkit-user-select: text;
}
.qlist { overflow-y: auto; margin: 0 -4px; padding: 0 4px; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
.qrow b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow span { display: block; color: var(--muted); font: 12.5px/1.4 var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.qrow .rowacts { display: flex; gap: 6px; }
.qrow .rowacts button { height: 34px; padding: 0 11px; border-radius: 8px; border: 1px solid var(--line-2); background: transparent; color: var(--paper-2); cursor: pointer; }
.qform { display: grid; gap: 10px; }
.qform label { display: grid; gap: 5px; font-size: 13px; color: var(--paper-2); }
.qform input, .qform select, .qform textarea {
  height: 42px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--black);
  color: var(--paper); font: 16px var(--sans);
}
.qform textarea { height: auto; min-height: 64px; padding: 10px 12px; font: 15px/1.4 var(--mono); resize: vertical; }
.qform .hint { color: var(--muted); font-size: 12.5px; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 12px; color: var(--paper-2); font-size: 13.5px; }

.compose textarea:focus-visible { outline: none; border-color: rgba(255,106,61,.6); }
@media (min-width: 900px) {
  .quick { padding-left: 14px; padding-right: 14px; }
  .keys { max-width: 640px; margin: 0 auto; }
}
@media (pointer: fine) {
  :root { --key-h: 36px; }
  .key { font-size: 13px; }
  .qbtn { height: 30px; }
}
@media (prefers-reduced-motion: reduce) { .conn.connecting i { animation: none; } .notice { transition: none; } }
</style>
</head>
<body>
<div id="app">
  <header class="head">
    <button class="conn connecting" id="conn" type="button" aria-live="polite"><i></i><span>Connecting</span></button>
    <div class="title" id="title">tmux session main</div>
    <div class="tools">
      <button class="tool desk" id="copyBtn" type="button">Copy</button>
      <button class="tool kbd" id="kbdBtn" type="button" aria-pressed="false">Keyboard</button>
    </div>
  </header>

  <main class="term-wrap" id="termWrap">
    <div id="term"></div>
    <div class="touch-layer" id="touchLayer" aria-hidden="true"></div>
    <button class="to-bottom" id="toBottom" type="button" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.5v10M3.5 8.5 8 13l4.5-4.5"/></svg>
      Jump to bottom
    </button>
    <div class="notice" id="notice" role="status"></div>
  </main>

  <div class="dock">
    <div class="quick scroller" id="quick" aria-label="Quick commands"></div>
    <div class="keys" id="keys" aria-label="Terminal keys"></div>
  </div>
</div>

<div class="scrim" id="copyScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="copyTitle">
    <h2 id="copyTitle">Copy from the screen</h2>
    <p class="sub">Press and hold to select part of it, or copy the whole screen.</p>
    <pre class="screen-text" id="screenText"></pre>
    <div class="acts">
      <button class="btn primary" id="copyAll" type="button">Copy whole screen</button>
      <button class="btn" id="copySel" type="button">Copy selected text</button>
      <button class="btn right" id="copyClose" type="button">Close</button>
    </div>
  </div>
</div>

<div class="scrim" id="quickScrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="quickTitle">
    <h2 id="quickTitle">Quick buttons</h2>
    <p class="sub">Saved in this browser.</p>
    <div id="quickBody"></div>
  </div>
</div>

<!--#include vendor/xterm.js-->
<!--#include vendor/addon-fit.js-->
<!--#include vendor/addon-webgl.js-->
<!--#include vendor/addon-unicode11.js-->
<!--#include vendor/addon-web-links.js-->
<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
};
const coarse = matchMedia("(pointer: coarse)").matches;
const DASHBOARD_PORT = "__DASHBOARD_PORT__";

// ---------------------------------------------------------------- terminal
const FONT_MIN = 8, FONT_MAX = 28;
let fontSize = store.get("wt.font", coarse ? 13 : 14);
const term = new Terminal({
  fontFamily: '"Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, "DejaVu Sans Mono", monospace',
  fontSize, lineHeight: 1.12, cursorBlink: true, cursorStyle: "bar", allowProposedApi: true,
  scrollback: 2000, macOptionIsMeta: true, rightClickSelectsWord: true, drawBoldTextInBrightColors: false,
  theme: {
    background: "#0d0b0a", foreground: "#e6dfd8", cursor: "#ff6a3d", cursorAccent: "#0d0b0a",
    selectionBackground: "rgba(255,106,61,.32)", selectionInactiveBackground: "rgba(255,106,61,.18)",
    black: "#1d1814", red: "#ff5f6d", green: "#8fcf8a", yellow: "#e8b04a", blue: "#7aa7e8", magenta: "#c99be8",
    cyan: "#6fc7b4", white: "#c4bab1", brightBlack: "#5e554d", brightRed: "#ff8a8f", brightGreen: "#b2e2a6",
    brightYellow: "#f3cb7a", brightBlue: "#a6c4f0", brightMagenta: "#dcbaf2", brightCyan: "#9ee0d1", brightWhite: "#efe9e3",
  },
});
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
const uni = new Unicode11Addon.Unicode11Addon();
term.loadAddon(uni);
term.unicode.activeVersion = "11";
term.loadAddon(new WebLinksAddon.WebLinksAddon((e, uri) => window.open(uri, "_blank", "noopener")));
term.open($("term"));
// Phones: only a deliberate tap on the terminal opens the keyboard (see the touch handler). Dragging to scroll,
// pressing and holding, or anything else that happens to focus xterm's hidden input is undone at once.
let termFocusOk = false;
function focusTerm() {
  const ta = term.textarea;
  if (!ta) return;
  termFocusOk = true;
  ta.removeAttribute("inputmode");
  ta.focus({ preventScroll: true });
}
if (coarse && term.textarea) {
  const ta = term.textarea;
  ta.setAttribute("inputmode", "none");
  ta.setAttribute("autocapitalize", "off");
  ta.setAttribute("autocorrect", "off");
  ta.addEventListener("focus", () => { if (!termFocusOk) ta.blur(); });
  ta.addEventListener("blur", () => { termFocusOk = false; ta.setAttribute("inputmode", "none"); });
}
// Phones use xterm's DOM renderer: with WebGL the glyphs could be drawn at the wrong pixel ratio, twice as
// wide as the cells, so half of every line ran off the right edge.
if (!coarse) try {
  const gl = new WebglAddon.WebglAddon();
  gl.onContextLoss(() => gl.dispose());
  term.loadAddon(gl);
} catch { /* DOM renderer is fine */ }

let fitTimer = 0;
function refit() {
  cancelAnimationFrame(fitTimer);
  fitTimer = requestAnimationFrame(() => { try { fit.fit(); } catch {} });
}
// Re-measure once the web font is in (glyph width changes the column count)
if (document.fonts && document.fonts.load) {
  document.fonts.load(`${fontSize}px "Geist Mono"`).then(() => {
    term.options.fontFamily = term.options.fontFamily; refit();
  }).catch(() => {});
}

function setFont(n, save = true) {
  n = Math.max(FONT_MIN, Math.min(FONT_MAX, Math.round(n)));
  if (n === term.options.fontSize) return;
  fontSize = n;
  term.options.fontSize = n;
  refit();
  if (save) store.set("wt.font", n);
}

// ---------------------------------------------------------------- ttyd connection
// ttyd protocol: client sends a JSON hello, then binary frames prefixed '0' input / '1' resize;
// the server sends '0' output / '1' window title / '2' preferences.
const enc = new TextEncoder();
const wsUrl = (location.protocol === "https:" ? "wss://" : "ws://") + location.host +
  location.pathname.replace(/[^/]*$/, "") + "ws" + location.search;
let ws = null, retry = 0, retryTimer = 0, hiddenAt = 0, everConnected = false;
const conn = $("conn");

function setConn(state, text) {
  conn.className = "conn " + state;
  conn.querySelector("span").textContent = text;
}
function connect() {
  clearTimeout(retryTimer);
  if (ws) { ws.onclose = ws.onerror = ws.onmessage = null; try { ws.close(); } catch {} }
  setConn("connecting", everConnected ? "Reconnecting" : "Connecting");
  const sock = ws = new WebSocket(wsUrl, ["tty"]);
  sock.binaryType = "arraybuffer";
  sock.onopen = () => {
    retry = 0; everConnected = true;
    term.reset();               // tmux redraws the whole screen on attach
    scrolled = 0; showToBottom();
    sock.send(enc.encode(JSON.stringify({ AuthToken: "", columns: term.cols, rows: term.rows })));
    setConn("live", "Connected");
  };
  sock.onmessage = ev => {
    const u = new Uint8Array(ev.data);
    const cmd = String.fromCharCode(u[0]);
    if (cmd === "0") term.write(u.subarray(1));
  };
  sock.onclose = () => {
    if (ws !== sock) return;
    const wait = Math.min(10000, 600 * 2 ** retry++);
    setConn("offline", navigator.onLine === false ? "Offline" : `Reconnecting in ${Math.ceil(wait / 1000)}s`);
    retryTimer = setTimeout(connect, wait);
  };
}
function live() { return ws && ws.readyState === WebSocket.OPEN; }
function sendRaw(s) {
  if (!live()) { notice("Not connected. Tap the status to reconnect."); return false; }
  const b = enc.encode(s), p = new Uint8Array(b.length + 1);
  p[0] = 48; p.set(b, 1);
  ws.send(p);
  return true;
}
// tmux sets the title ("main: claude"); ttyd's own title message is just the command line, so it is ignored
term.onTitleChange(t => { $("title").textContent = t; });
term.onResize(({ cols, rows }) => {
  if (live()) ws.send(enc.encode("1" + JSON.stringify({ columns: cols, rows })));
});
conn.addEventListener("click", () => { retry = 0; connect(); });
addEventListener("online", () => { if (!live()) { retry = 0; connect(); } });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  // After the phone sleeps the socket can look open while being dead; reattaching is cheap with tmux
  if (!live() || Date.now() - hiddenAt > 20000) { retry = 0; connect(); }
  refit();
});

// ---------------------------------------------------------------- scrolling through tmux history
// One step = two lines of tmux history, or one mouse-wheel notch for a fullscreen app like Claude Code
const K_UP = "\x1b[97~", K_DOWN = "\x1b[98~", K_BOTTOM = "\x1b[99~";   // see tmux.conf
const STEP_LINES = 2, MAX_STEPS = 400;
let scrolled = 0;  // steps scrolled up, as far as this page knows
const toBottom = $("toBottom");
function showToBottom() { toBottom.hidden = scrolled <= 0; }
function scrollLines(n) {
  if (!n || !live()) return;
  if (n > 0) { n = Math.min(n, MAX_STEPS - scrolled); if (n > 0) { sendRaw(K_UP.repeat(n)); scrolled += n; } }
  else { const m = Math.min(-n, Math.max(scrolled, 0)); if (m) sendRaw(K_DOWN.repeat(m)); scrolled -= m; }
  showToBottom();
}
// Scroll back down as far as we went up (a fullscreen app has no "cancel"), then leave tmux copy mode
function jumpToBottom() { if (scrolled > 0) sendRaw(K_DOWN.repeat(scrolled) + K_BOTTOM); scrolled = 0; showToBottom(); }
toBottom.addEventListener("click", () => { jumpToBottom(); if (!coarse) term.focus(); });

// Everything typed goes through here: leave copy mode first, so keys reach the program, not the scrollback
function send(s) {
  if (scrolled > 0) jumpToBottom();
  return sendRaw(s);
}

term.attachCustomWheelEventHandler(ev => {
  const cell = stepHeight();
  let lines = ev.deltaMode === 1 ? ev.deltaY / STEP_LINES : ev.deltaY / cell;
  lines = Math.sign(lines) * Math.max(1, Math.round(Math.abs(lines)));
  scrollLines(-lines);
  ev.preventDefault();
  return false;
});
function cellHeight() { return Math.max(8, $("term").clientHeight / Math.max(1, term.rows)); }
function stepHeight() { return cellHeight() * STEP_LINES; }

// Touch: drag up/down scrolls (with momentum), a quick tap opens the keyboard to type into the terminal,
// press and hold selects text (the phone's own selection handles and Copy menu), two fingers pinch the font size.
let touching = false;
const layer = $("touchLayer");
function layerSelection() {
  const sel = getSelection();
  return sel && !sel.isCollapsed && sel.anchorNode && layer.contains(sel.anchorNode) ? sel : null;
}
(() => {
  const wrap = $("termWrap");

  const on = document.activeElement === term.textarea;
  kbdBtn.classList.toggle("on", on);
  kbdBtn.setAttribute("aria-pressed", on ? "true" : "false");
  kbdBtn.textContent = on ? "Hide keyboard" : "Keyboard";
}
onTap(kbdBtn, () => {
  if (document.activeElement === term.textarea) term.textarea.blur(); else focusTerm();
  renderKbd();
});

// fade the edge of a sideways row while there is more of it to see
function markMore(el) { el.classList.toggle("more", el.scrollLeft + el.clientWidth < el.scrollWidth - 4); }
for (const el of document.querySelectorAll(".scroller")) {
  el.addEventListener("scroll", () => markMore(el), { passive: true });
  new ResizeObserver(() => markMore(el)).observe(el);
  new MutationObserver(() => markMore(el)).observe(el, { childList: true });
}
if (term.textarea) {
  term.textarea.addEventListener("focus", () => { app.classList.add("termfocus"); renderKbd(); });
  term.textarea.addEventListener("blur", () => { app.classList.remove("termfocus"); renderKbd(); });
}

connect();
if (!coarse) term.focus();
if (coarse && !store.get("wt.hint2", false)) {
  setTimeout(() => notice("Drag to scroll · tap to type · hold to select text", 5000), 1200);
  store.set("wt.hint2", true);
}

// For tests and debugging from the console
window.wt = { term, send, typeText, keySeq, mods, get scrolled() { return scrolled; } };
})();
</script>
</body>
</html>

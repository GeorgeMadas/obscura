# Web Terminal (deploy/terminal): tmux settings for the phone-friendly ttyd page.
# attach.sh sources this on every connect, so edits apply on the next reconnect.
# Options that would change other tmux sessions on the box (status bar) are set per session in attach.sh.
set -s escape-time 0              # Esc reaches Claude Code at once instead of waiting to pair with the next key
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"
setw -g aggressive-resize on      # a phone and a desktop can be attached at once without shrinking each other
setw -g window-size smallest      # the screen fits the narrowest attached page, so no page has text cut off on the right

# Mouse mode stays off so xterm.js keeps native text selection on desktop. The page scrolls with three
# private keys instead (touch drag, mouse wheel, "Jump to bottom"); one key = one scroll step:
#   ESC [ 9 7 ~  scroll up     ESC [ 9 8 ~  scroll down     ESC [ 9 9 ~  leave tmux copy mode
# Where a step goes depends on what is on screen:
#   - a fullscreen app that reads the mouse (Claude Code): one mouse-wheel notch, sent as an SGR mouse
#     report (ESC [ < 64/65 ; 10 ; 5 M) straight to the app. tmux has no history there, so copy mode
#     would only show an empty "[0/0]".
#   - a fullscreen app without the mouse (less, vim): the Up / Down arrow key
#   - a plain shell: tmux copy mode, two lines per step; scrolling back to the bottom leaves it
set -s user-keys[0] "\e[97~"
set -s user-keys[1] "\e[98~"
set -s user-keys[2] "\e[99~"
bind -n User0 if -F "#{alternate_on}" { if -F "#{mouse_any_flag}" { send-keys -H 1b 5b 3c 36 34 3b 31 30 3b 35 4d } { send-keys Up } } { copy-mode -e ; send-keys -X -N 2 scroll-up }
bind -n User1 if -F "#{alternate_on}" { if -F "#{mouse_any_flag}" { send-keys -H 1b 5b 3c 36 35 3b 31 30 3b 35 4d } { send-keys Down } }
bind -n User2 if -F "#{pane_in_mode}" "send-keys -X cancel"
bind -T copy-mode User0 send-keys -X -N 2 scroll-up
bind -T copy-mode User1 send-keys -X -N 2 scroll-down
bind -T copy-mode User2 send-keys -X cancel
bind -T copy-mode-vi User0 send-keys -X -N 2 scroll-up
bind -T copy-mode-vi User1 send-keys -X -N 2 scroll-down
bind -T copy-mode-vi User2 send-keys -X cancel

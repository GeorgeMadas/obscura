# Web Terminal (deploy/terminal): tmux settings for the phone-friendly ttyd page.
# attach.sh sources this on every connect, so edits apply on the next reconnect.
# Options that would change other tmux sessions on the box (status bar) are set per session in attach.sh.
set -s escape-time 0              # Esc reaches Claude Code at once instead of waiting to pair with the next key
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on
set -g set-titles on
set -g set-titles-string "#S: #W"
setw -g aggressive-resize on      # a phone and a desktop can be attached at once without shrinking each other

# Mouse mode stays off so xterm.js keeps native text selection on desktop. The page scrolls tmux history
# with three private keys instead (touch drag, mouse wheel, "Jump to bottom"):
#   ESC [ 9 7 ~  scroll up one line (enters copy mode; scrolling back to the bottom leaves it)
#   ESC [ 9 8 ~  scroll down one line
#   ESC [ 9 9 ~  leave copy mode (jump to bottom); also sent before any input typed while scrolled up
set -s user-keys[0] "\e[97~"
set -s user-keys[1] "\e[98~"
set -s user-keys[2] "\e[99~"
bind -n User0 copy-mode -e \; send-keys -X scroll-up
bind -n User1 if -F "#{pane_in_mode}" "send-keys -X scroll-down"
bind -n User2 if -F "#{pane_in_mode}" "send-keys -X cancel"
bind -T copy-mode User0 send-keys -X scroll-up
bind -T copy-mode User1 send-keys -X scroll-down
bind -T copy-mode User2 send-keys -X cancel
bind -T copy-mode-vi User0 send-keys -X scroll-up
bind -T copy-mode-vi User1 send-keys -X scroll-down
bind -T copy-mode-vi User2 send-keys -X cancel
